# Unified Local Mind Configuration

voice_hub:
  host: "0.0.0.0"
  port: 8100
  endpoint_path: "/xiaozhi/v1/"
  mode: "full" # "echo" or "full"
  dev_fallbacks: false # When false, failed service calls return errors rather than fabricated data

vision_orchestrator:
  host: "0.0.0.0"
  port: 8088
  simulated_vision: false # When false, returns empty detections unless real frames are processed
  confidence_threshold: 0.5
  mirror_pan: true # Camera mirrored coordinate mapping

# MQTT Bus (Mosquitto :1883)
mqtt:
  host: "127.0.0.1" # Host loopback for orchestrator (robots on Wi-Fi connect to host LAN IP, e.g. 192.168.1.50 or fallback 192.168.50.1)
  port: 1883
  client_id: "localmind-orchestrator"
  reconnect_interval_sec: 5

stt:
  url: "http://127.0.0.1:8080/inference"
  model_size: "small"
  language: "en"

llm:
  host: "http://127.0.0.1:11434"
  model: "ministral-3:3b"
  system_prompt_path: "hub/persona/system.md"
  temperature: 0.7
  max_tokens: 100

tts:
  url: "http://127.0.0.1:8000"
  voice: "alba"
  sample_rate: 16000
  frame_duration_ms: 60

audio:
  sample_rate: 16000
  channels: 1
  frame_duration_ms: 60
  frame_size: 960 # 16000 * 0.060
