[package]
name = "cynpase-bot"
version = "0.1.0"
edition = "2021"
description = "Local-first AI hub for StackChan robot speaking Xiaozhi protocol"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
cynapse-core = { path = "../cynapse-mini/harness/cynapse-core" }
cynapse-engine = { path = "../cynapse-mini/engine/cynapse-engine" }
cynapse-memory = { path = "../cynapse-mini/memory/cynapse-memory" }
rusqlite = { version = "0.32", features = ["bundled"] }
eframe = "0.29"
opus = "0.3"

[[bin]]
name = "cynpase-bot"
path = "src/main.rs"

[[bin]]
name = "cynpase-gui"
path = "src/gui_main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
